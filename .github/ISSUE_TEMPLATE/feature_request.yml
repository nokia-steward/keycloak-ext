name: Feature request
description: Suggest an idea or enhancement for an extension
labels: ["enhancement"]
body:
  - type: dropdown
    id: extension
    attributes:
      label: Extension
      description: Which extension does this affect? (Used to auto-apply the `ext:<name>` label.)
      options:
        - email-mtls
        - repository-wide / shared files
        - new extension proposal
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Why is the current behavior not enough?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, and any relevant Keycloak/SMTP version details.
    validations:
      required: false
