name: email-mtls integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    name: integration tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run integration tests
        working-directory: email-mtls
        run: ./mvnw -B -ntp -Pit verify
