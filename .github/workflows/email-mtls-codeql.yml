# CodeQL code scanning for the email-mtls extension.
# One CodeQL workflow per extension keeps scanning independent and path-filtered.
name: email-mtls CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'email-mtls/**'
      - '.github/workflows/email-mtls-codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'email-mtls/**'
      - '.github/workflows/email-mtls-codeql.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build
        working-directory: email-mtls
        run: ./mvnw -B -ntp -DskipTests package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
