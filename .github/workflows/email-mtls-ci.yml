name: email-mtls CI

on:
  push:
    branches: [main]
    paths:
      - 'email-mtls/**'
      - '.github/workflows/email-mtls-ci.yml'
  pull_request:
    paths:
      - 'email-mtls/**'
      - '.github/workflows/email-mtls-ci.yml'

permissions:
  contents: read

concurrency:
  group: email-mtls-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        working-directory: email-mtls
        run: ./mvnw -B -ntp verify
