# Publishes a GitHub Release for the email-mtls extension.
# The version is derived from the tag: email-mtls/v<keycloak.version>-<release.number>
# (e.g. email-mtls/v26.6.3-1) -> version 26.6.3-1 -> JAR keycloak-email-mtls-26.6.3-1.jar.
# Keep email-mtls/pom.xml (keycloak.version + release.number) in sync with the tag.
name: email-mtls Release

on:
  push:
    tags:
      - 'email-mtls/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. email-mtls/v26.6.3-1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#email-mtls/v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: email-mtls
        run: ./mvnw -B -ntp verify

      - name: Compute SHA-256 checksum
        id: artifacts
        working-directory: email-mtls/target
        run: |
          JAR=$(ls keycloak-email-mtls-*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar' | head -n1)
          sha256sum "$JAR" > "${JAR}.sha256"
          echo "jar=email-mtls/target/${JAR}" >> "$GITHUB_OUTPUT"
          echo "sha=email-mtls/target/${JAR}.sha256" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          awk -v ver="[${VERSION}]" '
            /^## / { if (started) exit; if (index($0, ver)) { started=1 }; next }
            started { print }
          ' email-mtls/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See email-mtls/CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: email-mtls ${{ steps.tag.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.artifacts.outputs.jar }}
            ${{ steps.artifacts.outputs.sha }}
